<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Quiz</title><style>

</div></section><section class="panel hidden" id="quiz"><div class="stats"><span id="count"></span><span id="score"></span></div><div class="bar"><i id="progress"></i></div><div class="quiz"><div class="unit" id="unit"></div><div class="word" id="word"></div><input id="answer" autocomplete="off" placeholder="한국어 뜻을 입력하세요"><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="submit">제출</button><button id="skip">다음</button></div></div></section><section class="panel result hidden" id="result"><h2>🎉 결과</h2><div class="score" id="final"></div><p id="msg"></p><button class="primary" id="retry">다시 풀기</button></section></main><script>

ntory","재고, 물품 목록"],["중간고사","customs clearance","통관"],["중간고사","logistics","실행 계획, 물류"],["중간고사","tracking number","추적 번호"],["중간고사","Formal","공식적인"],["중간고사","one of the + 복수명사","~ 중 하나"]];
let mode="all",quiz=[],i=0,correct=0,wrong=0,locked=false;
const $=id=>document.getElementById(id), norm=s=>s.replace(/\s+/g,"");
["all","1","2","3","4","6","midterm"].forEach((u,n)=>{let b=document.createElement("button");b.textContent=u==="all"?"전체 100":u==="midterm"?"중간고사 단어": "Unit "+u;b.onclick=()=>{mode=u;document.querySelectorAll("#units button").forEach(x=>x.classList.remove("primary"));b.classList.add("primary")};$("units").appendChild(b);if(n===0)b.classList.add("primary")});
function selected(){return mode==="all"?data:mode==="midterm"?midtermData:data.filter(x=>x[0]==="Unit "+mode)}
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){quiz=$("order").value==="shuffle"?shuffle(selected()):[...selected()];i=0;correct=0;wrong=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");show()}
function show(){if(i>=quiz.length)return finish();locked=false;let q=quiz[i];$("count").textContent=(i+1)+" / "+quiz.length;$("score").textContent="정답 "+correct+" · 오답 "+wrong;$("progress").style.width=(i/quiz.length*100)+"%";$("unit").textContent=q[0];$("word").textContent=q[1];$("answer").value="";$("answer").disabled=false;$("feedback").textContent="";$("submit").textContent="제출";$("answer").focus()}
function check(){if(locked)return;let q=quiz[i],v=norm($("answer").value);if(!v)return;$("answer").disabled=true;locked=true;if(v===norm(q[2])){correct++;$("feedback").innerHTML='<span class="ok">✓ 정답!</span>';setTimeout(()=>{i++;show()},550)}else{wrong++;$("feedback").innerHTML='<span class="bad">✗ 오답</span><br>정답: '+q[2];$("submit").textContent=i===quiz.length-1?"결과 보기":"다음";$("score").textContent="정답 "+correct+" · 오답 "+wrong}}
function next(){if(!locked)return;i++;show()}
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");let p=Math.round(correct/quiz.length*100);$("final").textContent=correct+" / "+quiz.length;$("msg").textContent=p===100?"완벽해요! 🎉":p>=80?"아주 잘했어요! "+p+"점":p+"점 — 틀린 단어를 다시 복습해보세요."}
$("start").onclick=start;$("submit").onclick=()=>locked?next():check();$("skip").onclick=next;$("retry").onclick=start;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")locked?next():check()});
</script></body></html>
