<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>Essential Vocabulary - Final Exam</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033}
main{max-width:780px;margin:auto;padding:22px 14px 40px}header{text-align:center}h1{font-size:26px;margin:6px 0}.sub{color:#667085}
.panel{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin-top:16px;box-shadow:0 4px 18px #17203312}
.controls{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;border-radius:10px}
button{border:0;padding:12px 15px;background:#eef1f5;font-weight:700;min-height:46px;cursor:pointer}
button.primary{background:#5b5ce2;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
select{padding:12px;border:1px solid #d9dde5;background:#fff}
.quiz{text-align:center}.unit{font-size:14px;font-weight:800;color:#5b5ce2}
.word{font-size:34px;font-weight:850;margin:12px 0 8px;word-break:break-word}
.word.important{color:#d92d20}.important-label{display:inline-block;background:#fee4e2;color:#b42318;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;margin-bottom:12px}
input{width:100%;padding:14px;border:2px solid #d9dde5;text-align:center;font-size:20px;outline:none}
input:focus{border-color:#5b5ce2}.actions{display:flex;gap:8px;justify-content:center;margin-top:12px}.actions button{flex:1}
.feedback{min-height:54px;margin:14px auto;font-weight:800;font-size:18px}.ok{color:#168a55}.bad{color:#c0392b}
.stats{display:flex;justify-content:space-between;color:#667085;font-size:14px;margin-bottom:10px}
.bar{height:8px;background:#e8ebf1;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:#5b5ce2;width:0}
.hidden{display:none}.result{text-align:center}.score{font-size:48px;font-weight:900}
.hint{font-size:13px;color:#667085;margin:10px 0 0}.mode-button{flex:1;min-width:100px}
.mode-button.selected{background:#5b5ce2;color:white}
.result-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.result-actions button{flex:1}
@media(max-width:600px){main{padding:12px 10px 28px}h1{font-size:23px}.word{font-size:29px}.panel{padding:12px}.controls button{flex:1}input{font-size:18px}}
</style>
</head>
<body>
<main>
<header><h1>📚 Essential Vocabulary</h1><p class="sub">Unit 8–12 · Final Exam Vocabulary</p></header>
<section class="panel">
  <strong>시험 범위 선택</strong>
  <div class="controls" id="units" style="margin-top:10px"></div>
  <div class="controls" style="margin-top:10px">
    <select id="order" aria-label="문제 순서"><option value="shuffle">랜덤 출제</option><option value="ordered">순서대로</option></select>
    <button class="primary" id="start">퀴즈 시작</button>
  </div>
  <p class="hint"><span style="color:#d92d20;font-weight:800">★ 중요</span> 표시된 기말고사 단어는 빨간색으로 표시됩니다.</p>
</section>
<section class="panel hidden" id="quiz">
  <div class="stats"><span id="count"></span><span id="score"></span></div><div class="bar"><i id="progress"></i></div>
  <div class="quiz"><div class="unit" id="unit"></div><div class="word" id="word"></div><div id="importantLabel" class="important-label hidden">★ 기말고사 중요 단어</div>
  <input id="answer" autocomplete="off" placeholder="한국어 뜻을 입력하세요">
  <div class="feedback" id="feedback"></div>
  <div class="actions"><button class="primary" id="submit">제출</button><button id="skip">모르겠어요</button></div></div>
</section>
<section class="panel result hidden" id="result">
  <h2>🎉 시험 결과</h2><div class="score" id="final"></div><p id="msg"></p>
  <div class="result-actions"><button class="primary" id="retry">같은 범위 다시 풀기</button><button id="retryWrong">오답만 다시 풀기</button></div>
  <p class="hint" id="wrongSummary"></p>
</section>
</main>
<script>
const data = [
["Unit 8","Lease","임대"],["Unit 8","Tenant","세입자"],["Unit 8","Landlord","집주인"],["Unit 8","Mortgage","담보 대출"],["Unit 8","Property value","부동산 가치"],
["Unit 8","Real estate agent","부동산 업자"],["Unit 8","Down payment","계약금"],["Unit 8","Appraisal","평가"],["Unit 8","Foreclosure","압류"],["Unit 8","Equity","자기 자본, 주식"],
["Unit 8","Title","소유권, 소유증서"],["Unit 8","Deed","증서"],["Unit 8","Listing","목록"],["Unit 8","Inspection","점검, 검사"],["Unit 8","Zoning","지역, 구역"],
["Unit 8","Renovation","개조, 보수"],["Unit 8","Condominium","콘도미니엄"],["Unit 8","Mortgage rate","주택 담보 대출 금리"],["Unit 8","Liability","법적 책임"],["Unit 8","Closing costs","부동산 매매 수수료"],
["Unit 9","Merger","합병"],["Unit 9","Acquisition","인수"],["Unit 9","Revenue","수익"],["Unit 9","Profit","이익"],["Unit 9","Stakeholder","이해관계자"],
["Unit 9","Alliance","연합"],["Unit 9","Contract","계약"],["Unit 9","Invoice","송장"],["Unit 9","Negotiation","협상"],["Unit 9","Executive","경영진"],
["Unit 9","Market share","시장 점유율"],["Unit 9","Dividend","배당금"],["Unit 9","Overhead","간접비"],["Unit 9","Product line","제품 라인"],["Unit 9","Entrepreneur","기업가"],
["Unit 9","Supply chain","공급망"],["Unit 9","Vendor","공급업체"],["Unit 9","Inventory","재고"],["Unit 9","Wholesaler","도매업체"],["Unit 9","Profit margin","이익 마진"],
["Unit 10","Assembly line","공정 라인"],["Unit 10","Quality control","품질 관리"],["Unit 10","Raw materials","원자재"],["Unit 10","Production schedule","생산 일정"],["Unit 10","Machinery","기계"],
["Unit 10","Workforce","인력"],["Unit 10","Output","생산량"],["Unit 10","Supplier","공급업체"],["Unit 10","Inventory","재고"],["Unit 10","Packaging","포장"],
["Unit 10","Shipment","배송"],["Unit 10","Efficiency","효율성"],["Unit 10","Automation","자동화"],["Unit 10","Prototype","프로토타입, 원형"],["Unit 10","Fabrication","제작"],
["Unit 10","Manufacturing Process","제조 공정"],["Unit 10","Material handling","자재 취급"],["Unit 10","Warehouse","창고"],["Unit 10","Batch","배치"],["Unit 10","Inspection","검사"],
["Unit 11","Hazard","위험"],["Unit 11","First aid","응급 처치"],["Unit 11","Safety gear","안전 장비"],["Unit 11","Emergency exit","비상구"],["Unit 11","Fire drill","소방 훈련"],
["Unit 11","Workplace safety","직장 안전"],["Unit 11","Accident report","사고 보고서"],["Unit 11","Health regulations","건강 규정"],["Unit 11","Protective equipment","보호 장비"],["Unit 11","Risk assessment","위험 평가"],
["Unit 11","Ergonomics","인체공학"],["Unit 11","Respirator","호흡 보호구"],["Unit 11","Safety Committee","안전 위원회"],["Unit 11","Inspection","검사"],["Unit 11","Compliance","규정 준수"],
["Unit 11","Evacuation","대피"],["Unit 11","Contamination","오염"],["Unit 11","Quarantine","격리"],["Unit 11","PPE (Personal Protective Equipment)","개인 보호 장비"],["Unit 11","Safety audit","안전 감사"],
["Unit 12","Complaint","불만"],["Unit 12","Inquiries","문의"],["Unit 12","Feedback","피드백"],["Unit 12","Return policy","반품 정책"],["Unit 12","Warranty","보증"],
["Unit 12","Refund","환불"],["Unit 12","Helpdesk","업무지원센터"],["Unit 12","Troubleshooting","문제 해결"],["Unit 12","Customer satisfaction","고객 만족"],["Unit 12","Service Quality","서비스 품질"],
["Unit 12","User Experience","사용자 경험"],["Unit 12","Call center","콜 센터"],["Unit 12","Resolution","해결"],["Unit 12","Service level agreement (SLA)","서비스 수준 계약"],["Unit 12","Follow-up","후속 조치"],
["Unit 12","Client","고객"],["Unit 12","FAQ (Frequently Asked Questions)","자주 묻는 질문"],["Unit 12","Queue","대기 줄"],["Unit 12","Knowledge base","지식창고"],["Unit 12","Customer loyalty","고객 충성도"]
];
const finalData = [
["기말고사","the protégé effect","가르치며 배우는 효과",true],
["기말고사","sustained","지속가능한",true],
["기말고사","mortgage","담보대출",false],
["기말고사","real estate","부동산",true],
["기말고사","foreclosure","압류",false],
["기말고사","Equity","자기지분, 주식",false],
["기말고사","locked in","고정짓다, 확정짓다",false],
["기말고사","liability","법적책임",true],
["기말고사","appropriate","적절한",true],
["기말고사","market reach","시장범위",false],
["기말고사","executive","경영진",true],
["기말고사","dividend","배당금",true],
["기말고사","reliable","믿을만한, 신뢰할만한",false],
["기말고사","consequently","결과적으로",false],
["기말고사","raw materials","원자재",false],
["기말고사","inventory","재고",false],
["기말고사","eco-friendly","친환경적인",false],
["기말고사","automation","자동화",false],
["기말고사","manual","육체의",false],
["기말고사","mandatory","의무적인",false],
["기말고사","equipment","장비",false],
["기말고사","compliance","규정준수",false],
["기말고사","evacuation","대피",false],
["기말고사","contamination","오염",true],
["기말고사","quarantine","격리",false],
["기말고사","hazardous","해로운",true],
["기말고사","audit","감사",false]
];
let mode="all", quiz=[], index=0, correct=0, wrong=0, wrongItems=[], locked=false, lastSelection=[];
const $=id=>document.getElementById(id);
const normalize=s=>s.toLocaleLowerCase().replace(/\s+/g,"").replace(/[.,!?]/g,"");
function shuffle(list){const a=[...list];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;}
const choices=[["all","전체 단어 100개"],["8","Unit 8"],["9","Unit 9"],["10","Unit 10"],["11","Unit 11"],["12","Unit 12"],["final","기말고사 27개"],["important","★ 중요 단어만"]];
choices.forEach(([value,label],i)=>{const b=document.createElement("button");b.className="mode-button"+(i===0?" selected":"");b.textContent=label;b.onclick=()=>{mode=value;document.querySelectorAll("#units button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");};$("units").appendChild(b);});
function selected(){if(mode==="all")return data;if(mode==="final")return finalData;if(mode==="important")return finalData.filter(x=>x[3]);return data.filter(x=>x[0]==="Unit "+mode);}
function start(list){lastSelection=list||selected();quiz=$("order").value==="shuffle"?shuffle(lastSelection):[...lastSelection];index=0;correct=0;wrong=0;wrongItems=[];$("result").classList.add("hidden");$("quiz").classList.remove("hidden");show();}
function show(){if(index>=quiz.length){finish();return;}locked=false;const q=quiz[index];$("count").textContent=(index+1)+" / "+quiz.length;$("score").textContent="정답 "+correct+" · 오답 "+wrong;$("progress").style.width=(index/quiz.length*100)+"%";$("unit").textContent=q[0];$("word").textContent=q[1];$("word").classList.toggle("important",!!q[3]);$("importantLabel").classList.toggle("hidden",!q[3]);$("answer").value="";$("answer").disabled=false;$("feedback").textContent="";$("submit").textContent="제출";$("answer").focus();}
function advance(){index++;show();}
function check(){if(locked)return;const q=quiz[index],value=normalize($("answer").value);if(!value)return;$("answer").disabled=true;locked=true;if(value===normalize(q[2])){correct++;$("feedback").innerHTML='<span class="ok">✓ 정답!</span>';setTimeout(advance,500);}else{wrong++;wrongItems.push(q);$("feedback").innerHTML='<span class="bad">✗ 오답</span><br>정답: '+q[2];$("submit").textContent="다음 문제";$("score").textContent="정답 "+correct+" · 오답 "+wrong;}}
function skip(){if(locked){advance();return;}const q=quiz[index];wrong++;wrongItems.push(q);locked=true;$("answer").disabled=true;$("feedback").innerHTML='<span class="bad">정답: '+q[2]+'</span>';$("submit").textContent="다음 문제";$("score").textContent="정답 "+correct+" · 오답 "+wrong;}
function finish(){ $("quiz").classList.add("hidden");$("result").classList.remove("hidden");const pct=Math.round(correct/quiz.length*100);$("final").textContent=correct+" / "+quiz.length;$("msg").textContent=pct===100?"완벽해요! 🎉":pct>=80?"아주 잘했어요! "+pct+"점":pct+"점 — 오답을 다시 복습해보세요.";$("wrongSummary").textContent=wrongItems.length?"틀린 단어 "+wrongItems.length+"개를 오답 재시험으로 다시 풀 수 있어요.":"틀린 단어가 없습니다!";}
$("start").onclick=()=>start();$("submit").onclick=()=>locked?advance():check();$("skip").onclick=skip;$("retry").onclick=()=>start(lastSelection);$("retryWrong").onclick=()=>{if(wrongItems.length)start([...wrongItems]);};$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")locked?advance():check();});
</script>
</body>
</html>
